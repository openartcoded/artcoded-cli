# Every tag v* (git tag v1.2.0 && git push origin v1.2.0): test, build linux amd64 + arm64, publish the
# GitHub release with the binaries and checksums.txt, push the docker image nbittich/artcoded-cli:<tag>
# (and :latest), then update the install section of the README on main.
# A tag with a "-" (v1.2.0-rc1) is published as a pre-release and leaves the README alone.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: tags
        run: |
          tags="nbittich/artcoded-cli:$GITHUB_REF_NAME"
          # a pre-release (v1.2.0-rc1) does not move latest
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,nbittich/artcoded-cli:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=nbittich/artcoded-cli:buildcache
          cache-to: type=registry,ref=nbittich/artcoded-cli:buildcache,mode=max

  readme:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update the install section of the README
        run: |
          scripts/readme-install.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "readme: install $GITHUB_REF_NAME"
          git push origin HEAD:main
