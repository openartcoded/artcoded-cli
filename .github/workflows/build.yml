# Every push on main: test, build linux amd64 + arm64, replace the "edge" pre-release (the latest build
# of main) and push the docker image nbittich/artcoded-cli:edge. Pull requests: test and build only.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # linux amd64, arm64 + checksums.txt
      - run: make dist VERSION="edge-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: artcoded-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  edge:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: edge-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artcoded-${{ github.sha }}
          path: dist
      - name: Replace the edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete edge --cleanup-tag --yes || true
          gh release create edge dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "edge: latest build of main" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%MZ). Install: \`curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/install.sh | sh -s -- edge\` · docker: \`nbittich/artcoded-cli:edge\`"

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: version
        run: echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: nbittich/artcoded-cli:edge
          cache-from: type=registry,ref=nbittich/artcoded-cli:buildcache
          cache-to: type=registry,ref=nbittich/artcoded-cli:buildcache,mode=max
